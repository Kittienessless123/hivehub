version: "3.8"

services:
  # Базы данных
  postgres-auth:
    image: postgres:15
    container_name: hivehub-postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: hivehub
      POSTGRES_PASSWORD: hivehub123
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Кэш и очереди
  rabbitmq:
    image: rabbitmq:3-management
    container_name: hivehub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build:
      context: ./services/auth-service  # ← ПРАВИЛЬНЫЙ ПУТЬ
      dockerfile: Dockerfile.dev
    container_name: hivehub-auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://hivehub:hivehub123@postgres-auth:5432/auth_db
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - JWT_EXPIRES_IN=15m
      - REFRESH_TOKEN_EXPIRES_IN=7d
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hivehub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./services/auth-service:/app  # ← ПРАВИЛЬНЫЙ ПУТЬ
      - /app/node_modules

  # API Gateway (ТОЖЕ ВНУТРИ SERVICES!)
  api-gateway:
    build:
      context: ./services/api-gateway  # ← ИЗМЕНИЛ!
      dockerfile: Dockerfile.dev
    container_name: hivehub-api-gateway
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://auth-service:3001
    volumes:
      - ./services/api-gateway:/app  # ← ИЗМЕНИЛ!
      - /app/node_modules
    depends_on:
      - auth-service
    networks:
      - hivehub-network

networks:
  hivehub-network:
    driver: bridge

volumes:
  postgres_auth_data: